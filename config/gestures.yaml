# ============================================================
# 手势预设库（Windows 独立调试 / Ubuntu 整机联调 共用）
# ============================================================
# 角度单位：度。顺序固定为：
#   [拇指Flex, 拇指Aux, 食指, 中指, 无名指, 小拇指]
#
# 主动关节角度上限（超出会被程序拒绝，这是安全保护）：
#   拇指Flex 0–59   拇指Aux 0–90   其余四指 0–81
#
# ⚠️⚠️ 重要说明 ⚠️⚠️
#   下面所有数值都是【示例值 / 占位值】，不是官方推荐值。
#   第一次使用必须做这两件事：
#     1. 用单指、极小幅度（2°）确认「数值变大 = 手指弯曲还是张开」；
#     2. 确认方向后再逐步放开行程，每次加 10° 左右观察。
#
#   直接照抄大行程数值，方向若相反，手指会顶到限位。
# ============================================================

meta:
  unit: degree
  motor_order: [拇指Flex, 拇指Aux, 食指, 中指, 无名指, 小拇指]
  # ⚠️ 角度上限与电机顺序的唯一出处为 config/revo2_hardware.yaml（程序以该文件为准）
  #    此处保留一份便于阅读，数值应与其保持一致
  angle_limits: [59.0, 89.0, 80.8, 80.8, 80.8, 80.8]
  verified: true           # ★ 已在真机确认（见下）
  verified_date: "2026-09-24"
  verified_by: "tao"
  # ============================================================
  # 真机验证结论（右手 SkuType.MediumRight，固件 1.0.22.U）
  # ------------------------------------------------------------
  # ① 方向：数值变大 = 手指弯曲。在 Normalized 模式下实测
  #    下发 1000 后读回 999~1000（满行程），下发 0 读回 0（伸直）。
  # ② 行程：逐关节单独下发 1000 的实读值 ——
  #    拇指屈曲 999、拇指对掌 949~1000、四指 999~1000，行程均充足。
  # ③ 单位换算：Normalized 模式的 0~1000 与实读值 1:1；
  #    换算角度用 值 = 角度 / 本表 angle_limits × 1000。
  #    例：四指 80.8° 对应 1000。
  # ④ 注意：本表为角度制（Physical 语义），而多数示例脚本下发的是
  #    Normalized 0~1000 值，两者需按上式换算，勿直接混用。
  # ============================================================

gestures:

  # ── 基础位姿 ─────────────────────────────────────────
  open:
    description: 完全张开（手背灯常亮后的自然位姿，上电校准结束就是这个状态）
    angles: [0, 0, 0, 0, 0, 0]
    duration_ms: 1000
    risk: low
    note: 最安全的目标位姿，调试时常用作「回到原点」

  fist:
    description: 握拳
    angles: [50, 70, 78, 78, 78, 78]      # ⚠️ 示例值，先验证方向
    duration_ms: 1200
    risk: medium
    note: 行程最大，运行前务必清空手指活动范围

  pinch:
    description: 捏（拇指与食指对捏）
    angles: [45, 55, 65, 5, 5, 5]         # ⚠️ 示例值
    duration_ms: 1000
    risk: medium
    note: 精细抓取的基础位姿，后续接触觉反馈时重点调这个

  point:
    description: 比指（只伸食指）
    angles: [40, 60, 0, 78, 78, 78]       # ⚠️ 示例值
    duration_ms: 1000
    risk: medium

  # ── 抓取相关 ─────────────────────────────────────────
  cylinder_grasp:
    description: 圆柱握（抓水杯、瓶子）
    angles: [45, 60, 60, 60, 60, 60]      # ⚠️ 示例值
    duration_ms: 1200
    risk: medium
    note: 拇指 Aux 需要电流维持锁定（拇指无机械锁定）

  bottle_grasp:
    description: 抓 500ml 瓶装水（对掌包络抓，抓瓶身中下部）
    angles: [45, 60, 60, 60, 60, 60]      # ⚠️ 从 cylinder_grasp 复制来的起点值
    duration_ms: 1200
    risk: medium
    note: >
      ★ 待真机调。起点是 cylinder_grasp，但抓瓶有两个额外要求：
      (1) 靠「包住 + 预紧力」而不是「夹住」—— 光滑瓶身夹的接触面太小，
          一抬就滑；
      (2) 重点调拇指 Aux（对掌外展），它决定能不能真正包住直径 6.5cm 的瓶身。
      调好后请在本条上标注实测日期，并把 values 固化下来，不要改 cylinder_grasp。
    verified: false
    target_object:
      type: 圆柱（瓶装水）
      diameter_cm: 6.5          # 按实测填
      weight_g: 500             # 满水约 500g；练习先用空瓶
      surface: 光滑 + 可能冷凝水（摩擦系数低）

  pinch_grasp:
    description: 指尖捏取（抓小物体）
    angles: [40, 50, 55, 10, 10, 10]      # ⚠️ 示例值
    duration_ms: 900
    risk: medium
    note: 建议配合触觉反馈做自适应抓握，避免捏碎或打滑

  tripod:
    description: 三指捏（拇指 + 食指 + 中指）
    angles: [42, 55, 50, 50, 5, 5]        # ⚠️ 示例值
    duration_ms: 1000
    risk: medium
    note: 三指捏持比两指更稳，适合拿细长物体

  lateral:
    description: 侧捏（拇指与食指侧面）
    angles: [20, 10, 35, 5, 5, 5]         # ⚠️ 示例值
    duration_ms: 900
    risk: medium
    note: 用于抓薄片物体（卡片、纸张）

  # ── 调试用 ───────────────────────────────────────────
  half_close:
    description: 半闭合（调试安全位，行程一半）
    angles: [25, 35, 39, 39, 39, 39]
    duration_ms: 1200
    risk: low
    note: 只想验证运动通路时用这个，比握拳安全得多

  safe_home:
    description: 安全归位（接近张开但略微收拢，适合机器人运动时保持）
    angles: [10, 15, 20, 20, 20, 20]
    duration_ms: 1000
    risk: low
    note: 整机做本体动作时，手保持这个姿态比完全张开更不容易碰坏
