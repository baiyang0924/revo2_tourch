# ============================================================
# 动作序列库
# ============================================================
# 用于「录制回放」和「成套复合动作」。
# 一个 sequence 就是一串带时间戳的关键帧。
#
# 角度单位：度。顺序固定为：
#   [拇指Flex, 拇指Aux, 食指, 中指, 无名指, 小拇指]
#
# duration_ms：从上一步到达这一步所用的期望时间
#              协议允许范围 1–2000 ms
#
# ⚠️ 所有角度均为【示例值】，真机确认方向后再调参。
# ⚠️ 序列越靠后的步骤越要留足时间，否则手会比手臂先到或后到，
#    做「本体 + 手」融合动作时尤其明显。
# ============================================================

meta:
  unit: degree
  motor_order: [拇指Flex, 拇指Aux, 食指, 中指, 无名指, 小拇指]
  # ⚠️ 角度上限与电机顺序的唯一出处为 config/revo2_hardware.yaml（程序以该文件为准）
  angle_limits: [59.0, 89.0, 80.8, 80.8, 80.8, 80.8]
  verified: false
  note: 角度上限与电机顺序已集中到 config/revo2_hardware.yaml，本表随其同步，不再独立维护

sequences:

  # ── 基础验证序列：第一次联调跑这个 ────────────────────
  基础自检:
    description: 张开 → 半闭 → 张开 → 握拳 → 张开。用来快速验证整条链路
    loop: false
    safe_first: true
    steps:
      - name: 张开
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 1200
        expect: 手指全部伸直
      - name: 半闭合
        angles: [25, 35, 39, 39, 39, 39]
        duration_ms: 1200
        expect: 手指弯曲约一半 —— 若方向反了立刻停
      - name: 张开
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 1200
      - name: 握拳
        angles: [50, 70, 78, 78, 78, 78]
        duration_ms: 1500
        expect: 完整握拳
      - name: 张开复位
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 1500

  # ── 抓取类 ───────────────────────────────────────────
  抓取圆柱:
    description: 张开 → 前伸就位 → 闭合握持 → 保持 → 松开
    loop: false
    steps:
      - name: 张开准备
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 1000
      - name: 预备位
        angles: [20, 30, 25, 25, 25, 25]
        duration_ms: 1000
        expect: 手呈半开杯状，等待靠近物体
      - name: 闭合握持
        angles: [45, 60, 60, 60, 60, 60]
        duration_ms: 1200
        expect: 贴合物体表面；若听到堵转异响说明夹太紧
      - name: 保持
        angles: [45, 60, 60, 60, 60, 60]
        duration_ms: 2000
      - name: 松开
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 1200

  捏取小物:
    description: 张开 → 指尖捏取 → 抬起保持 → 放下
    loop: false
    steps:
      - name: 张开
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 1000
      - name: 捏合
        angles: [40, 50, 55, 10, 10, 10]
        duration_ms: 900
        expect: 拇指与食指指尖接触
      - name: 保持
        angles: [40, 50, 55, 10, 10, 10]
        duration_ms: 2000
      - name: 松开
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 900

  # ── 交互类 ───────────────────────────────────────────
  挥手打招呼:
    description: 比指 → 反复张合。适合做演示
    loop: true
    steps:
      - name: 张开
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 600
      - name: 握拢
        angles: [35, 45, 50, 50, 50, 50]
        duration_ms: 600

  比数字一:
    description: 只伸食指
    loop: false
    steps:
      - name: 准备
        angles: [40, 60, 78, 78, 78, 78]
        duration_ms: 1200
      - name: 保持
        angles: [40, 60, 0, 78, 78, 78]
        duration_ms: 2500

  # ── 复合动作：与本体动作融合的示例 ─────────────────────
  # 这类序列的重点是「手部相位」与「本体相位」的配合。
  # 本体动作由运控算法负责，这里只定义手部的配合节奏。
  递物综合:
    description: 递送物品：手先张开等物 → 握持 → 保持不动（本体做抬臂递送）→ 到位松开
    loop: false
    robot_sync: true        # 标记该序列需要与本体动作同步
    steps:
      - name: 张开等待
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 800
        robot_phase: 本体前伸到递送位
      - name: 握持
        angles: [40, 55, 55, 55, 55, 55]
        duration_ms: 1000
        robot_phase: 本体静止等待
        expect: 稳定握持，不掉落
      - name: 保持
        angles: [40, 55, 55, 55, 55, 55]
        duration_ms: 3000
        robot_phase: 本体抬臂并前伸递送（此时手不要动）
      - name: 松开
        angles: [0, 0, 0, 0, 0, 0]
        duration_ms: 800
        robot_phase: 本体保持在递送位，等对方取走
      - name: 收回
        angles: [10, 15, 15, 15, 15, 15]
        duration_ms: 1000
        robot_phase: 本体收臂回原位

# ============================================================
# 本体 + 手 融合动作的设计要点（写在这里备忘）
# ============================================================
# 1. 两套控制器要同步：本体走运控算法，手走 CANFD，节奏不一致会「手比手臂先到」。
# 2. 手做闭合 / 松开时，本体尽量不要同时做剧烈动作，避免手臂线缆受力。
# 3. 留出安全余量：整机做本体动作时，手保持 safe_home 这类半闭合姿态，
#    比完全张开更不容易被碰到。
# 4. 先在仿真验证：运控 demo（demo.bxirobotics.cn）和 ELF3 MuJoCo 环境
#    都可以先跑通再去真机。
# 5. 录制回放：读反馈（2000–2005）按固定频率采样 → 存成序列 → 回放。
#    复杂动作比手写关键帧更靠谱。
